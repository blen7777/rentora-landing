    <text x="24" y="34" fill="#9FC2FF" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1.2">ESTADO DE FLOTA</text>
    <rect x="24" y="60" width="130" height="18" rx="9" fill="#22C55E" fill-opacity="0.82"/>
    <rect x="166" y="60" width="92" height="18" rx="9" fill="#60A5FA" fill-opacity="0.82"/>
