    <path d="M76 250H1204"/>
    <path d="M76 340H1204"/>
    <path d="M76 430H1204"/>
    <path d="M76 520H1204"/>
    <path d="M76 610H1204"/>
  </g>

  <g transform="translate(76 62)">
