<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rentora demo poster</title>
  <desc id="desc">Poster para el video demo de Rentora con estilo SaaS y panel de operacion.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="1130" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081B3A"/>
      <stop offset="0.52" stop-color="#0F2E73"/>
      <stop offset="1" stop-color="#112B5D"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="277" y1="121" x2="471" y2="301" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="780" y1="42" x2="1027" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur24" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="40" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="720" rx="40" fill="url(#glowBlue)" filter="url(#blur40)"/>
  <rect x="760" y="0" width="520" height="520" rx="40" fill="url(#glowCyan)" filter="url(#blur40)"/>

  <circle cx="1084" cy="118" r="96" fill="#93C5FD" fill-opacity="0.12"/>
  <circle cx="210" cy="610" r="138" fill="#38BDF8" fill-opacity="0.08"/>

  <g opacity="0.16" stroke="#EAF2FF">
